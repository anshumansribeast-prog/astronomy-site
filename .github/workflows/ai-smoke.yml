name: Beast AI smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t astronomy-site:ai-test .
      - name: Start site
        run: docker run -d --name beast-ai -p 8899:8899 astronomy-site:ai-test
      - name: Wait for site
        run: |
          for i in $(seq 1 25); do
            curl -fsS http://localhost:8899/api/beast/health >/dev/null && exit 0
            sleep 1
          done
          docker logs beast-ai
          exit 1
      - name: Test Beast
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: python3 tools/ai-smoke.py http://localhost:8899
      - name: Logs on failure
        if: failure()
        run: docker logs beast-ai || true
      - name: Stop site
        if: always()
        run: docker rm -f beast-ai || true
