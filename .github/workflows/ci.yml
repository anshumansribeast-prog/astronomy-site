# ===================================================================
# ci.yml — the gate every change has to walk through.
#
# The gate is cheapest-first: unit/router tests, image build, real smoke
# tests, then GHCR publish on main only.
# ===================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build image and smoke-test it
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Test Beast fallback gate without secrets
        run: python3 -m unittest test_beast_router.py

      - name: Build the image
        run: docker build -t astronomy-site:ci .

      - name: Start the container
        run: |
          docker run -d --name astro -p 8899:8899 astronomy-site:ci
          echo "waiting for the server to come up…"

      - name: Smoke test — does it really serve the site?
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8899/ > /dev/null; then
              echo "up after ${i}s"
              break
            fi
            if [ "$i" = "15" ]; then
              echo "::error::server never came up"
              docker logs astro
              exit 1
            fi
            sleep 1
          done

          pages="/ /index.html /planets.html /constellations.html /moon.html /facts.html /quiz.html /about.html /knowledge.html /beast.html /account.html /css/style.css /js/main.js"
          for page in $pages; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8899${page}")
            echo "GET ${page} -> ${code}"
            if [ "$code" != "200" ]; then
              echo "::error::${page} returned ${code}, expected 200"
              docker logs astro
              exit 1
            fi
          done

          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8899/does-not-exist)
          if [ "$code" != "404" ]; then
            echo "::error::expected 404 for a missing page, got ${code}"
            docker logs astro
            exit 1
          fi

      - name: Smoke test — do accounts actually work?
        run: |
          jar=$(mktemp)
          curl -fsS -c "$jar" -X POST http://localhost:8899/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_smoke_test","password":"ci-smoke-test-password"}' > /dev/null

          me=$(curl -fsS -b "$jar" http://localhost:8899/api/auth/me)
          echo "$me" | grep -q "ci_smoke_test" || { echo "::error::registered but /api/auth/me didn't recognize the session"; docker logs astro; exit 1; }

          curl -fsS -b "$jar" -X POST http://localhost:8899/api/auth/logout > /dev/null
          me_after=$(curl -fsS -b "$jar" http://localhost:8899/api/auth/me)
          echo "$me_after" | grep -q '\"user\":null' || { echo "::error::session still valid after logout"; docker logs astro; exit 1; }

          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8899/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_smoke_test","password":"the-wrong-password"}')
          [ "$status" = "401" ] || { echo "::error::wrong password returned ${status}, expected 401"; docker logs astro; exit 1; }

          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8899/api/beast/health)
          echo "GET /api/beast/health -> ${code}"
          [ "$code" = "200" ] || { echo "::error::Beast health check failed"; docker logs astro; exit 1; }

          learned=$(curl -fsS http://localhost:8899/api/beast/learned)
          echo "$learned" | grep -q '\"day\"' || { echo "::error::Beast daily learning failed"; docker logs astro; exit 1; }
          echo "Beast daily brain: ok"

      - name: Container logs
        if: always()
        run: docker logs astro || true

      - name: Stop the container
        if: always()
        run: docker rm -f astro || true

  publish:
    name: Publish to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/astronomy-site"

          docker build \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            .

          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo "\`${IMAGE}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
