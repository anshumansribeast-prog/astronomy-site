name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build image and smoke-test it
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Test Beast fallback gate without secrets
        run: node test_beast_ai.mjs

      - name: Test legacy Beast router helper
        run: python3 -m unittest test_beast_router.py

      - name: Build the image
        run: docker build -t astronomy-site:ci .

      - name: Start the container
        run: |
          docker run -d --name astro -p 8899:8899 astronomy-site:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8899/ > /dev/null; then
              echo "up after ${i}s"
              break
            fi
            if [ "$i" = "15" ]; then docker logs astro; exit 1; fi
            sleep 1
          done

      - name: Smoke test — site and APIs
        run: |
          pages="/ /index.html /planets.html /constellations.html /moon.html /facts.html /quiz.html /about.html /knowledge.html /beast.html /account.html /css/style.css /js/main.js"
          for page in $pages; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8899${page}")
            echo "GET ${page} -> ${code}"
            [ "$code" = "200" ] || { docker logs astro; exit 1; }
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8899/does-not-exist)
          [ "$code" = "404" ] || { docker logs astro; exit 1; }

          jar=$(mktemp)
          curl -fsS -c "$jar" -X POST http://localhost:8899/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_smoke_test","password":"ci-smoke-test-password"}' > /dev/null
          me=$(curl -fsS -b "$jar" http://localhost:8899/api/auth/me)
          echo "$me" | grep -q "ci_smoke_test" || { docker logs astro; exit 1; }
          curl -fsS -b "$jar" -X POST http://localhost:8899/api/auth/logout > /dev/null
          me_after=$(curl -fsS -b "$jar" http://localhost:8899/api/auth/me)
          echo "$me_after" | grep -q '\"user\":null' || { docker logs astro; exit 1; }

          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8899/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_smoke_test","password":"the-wrong-password"}')
          [ "$status" = "401" ] || { docker logs astro; exit 1; }

          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8899/api/beast/health)
          [ "$code" = "200" ] || { docker logs astro; exit 1; }
          learned=$(curl -fsS http://localhost:8899/api/beast/learned)
          echo "$learned" | grep -q '\"day\"' || { docker logs astro; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs astro || true

      - name: Stop the container
        if: always()
        run: docker rm -f astro || true

  publish:
    name: Publish to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out the code
        uses: actions/checkout@v5
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/astronomy-site"
          docker build -t "${IMAGE}:latest" -t "${IMAGE}:${{ github.sha }}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"
          echo "### Published" >> $GITHUB_STEP_SUMMARY
          echo "\`${IMAGE}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
