# Cosmos + Beast's Groq-powered brain.
# On the punah.pro box:
#   AI_API_KEY=your_groq_key docker compose pull && docker compose up -d
# Get a free key at https://console.groq.com
# Set ADMIN_USERNAME in the deployment environment to the exact account
# username that should be allowed into /backend. Do not put a password here.

services:
  web:
    image: ghcr.io/anshumansribeast-prog/astronomy-site:latest
    build: .
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      ASTRO_DATA_DIR: /data
      # Any OpenAI-compatible API works; Groq's free tier is the default.
      # Without AI_API_KEY, Beast answers from the site's own data.
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_API_URL: "${AI_API_URL:-https://api.groq.com/openai/v1}"
      AI_MODEL: "${AI_MODEL:-llama-3.3-70b-versatile}"
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in the deployment environment}
    volumes:
      - astronomy-data:/data

volumes:
  astronomy-data:
