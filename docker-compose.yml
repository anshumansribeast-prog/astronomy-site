# Cosmos + Beast's Groq-powered brain.
# On the punah.pro box:
#   AI_API_KEY=your_groq_key docker compose pull && docker compose up -d
# Set ADMIN_USERNAME in the deployment environment to the exact account
# username that should be allowed into /backend. Do not put a password here.

services:
  web:
    image: ghcr.io/anshumansribeast-prog/astronomy-site:latest
    build: .
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      ASTRO_DATA_DIR: /data
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_API_URL: "${AI_API_URL:-https://api.groq.com/openai/v1}"
      AI_MODEL: "${AI_MODEL:-openai/gpt-oss-120b}"
      # Optional second-opinion fallback. It is never called for normal answers.
      OPENAI_API_URL: "${OPENAI_API_URL:-https://api.openai.com/v1/responses}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-}"
      SEMICOLON_STATS_URL: "${SEMICOLON_STATS_URL:-}"
      SEMICOLON_STATS_TOKEN: "${SEMICOLON_STATS_TOKEN:-}"
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in the deployment environment}
    volumes:
      - astronomy-data:/data

volumes:
  astronomy-data:
