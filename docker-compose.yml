# Cosmos + Beast's Ollama brain.
# On the punah.pro box: docker compose pull && docker compose up -d
# First boot pulls llama3.2:3b (a few GB) into the ollama volume.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # Do not publish 11434 to the public internet.

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull llama3.2:3b
    restart: "no"

  web:
    image: ghcr.io/anshumansribeast-prog/astronomy-site:latest
    build: .
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      ASTRO_DATA_DIR: /data
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: llama3.2:3b
    volumes:
      - astronomy-data:/data
    depends_on:
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ollama-data:
  astronomy-data:
